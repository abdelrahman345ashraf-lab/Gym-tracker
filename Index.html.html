<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Minimal Gym Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:#f8f9fa;color:#1a1a1a;padding-bottom:90px}header{background:#fff;border-bottom:1px solid #e9ecef;padding:16px 20px;position:sticky;top:0;z-index:10}header h1{font-size:20px;font-weight:700}.nav-tabs{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;background:#fff;border-bottom:1px solid #e9ecef}.tab-btn{padding:8px 16px;border:1px solid #dee2e6;background:#fff;border-radius:20px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:#495057}.tab-btn.active{background:#000;color:#fff;border-color:#000}.container{max-width:600px;margin:0 auto;padding:16px}.exercise-card{background:#fff;border:1px solid #e9ecef;border-radius:12px;padding:16px;margin-bottom:12px}.ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ex-name{font-size:16px;font-weight:700;color:#111}.ex-target{font-size:13px;font-weight:600;background:#e9ecef;padding:3px 8px;border-radius:6px;color:#495057}.history-list{margin:10px 0;padding-top:10px;border-top:1px dashed #e9ecef}.history-item{font-size:13px;color:#6c757d;margin-bottom:4px;display:flex;justify-content:space-between}.history-item strong{color:#212529}.log-form{margin-top:12px;background:#f8f9fa;padding:12px;border-radius:8px;display:none}.log-form.open{display:block}.inputs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.input-group label{display:block;font-size:11px;text-transform:uppercase;color:#6c757d;margin-bottom:4px;font-weight:600}.input-group input{width:100%;padding:8px;border:1px solid #ced4da;border-radius:6px;font-size:14px;text-align:center}.btn{width:100%;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}.btn-dark{background:#000;color:#fff}.btn-outline{background:transparent;border:1px solid #000;color:#000;margin-top:8px}.timer-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9ecef;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.timer-display{font-size:18px;font-weight:700;font-family:monospace}.timer-btns{display:flex;gap:6px}.timer-btn{padding:6px 12px;border:1px solid #dee2e6;background:#f8f9fa;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
</style></head><body>
<header><h1>Workout Tracker</h1></header><div class="nav-tabs" id="categoryTabs"></div><div class="container" id="exerciseList"></div>
<div class="timer-bar"><div><span style="font-size:12px;color:#6c757d;display:block">Rest Timer</span><span class="timer-display" id="timerDisplay">00:00</span></div><div class="timer-btns"><button class="timer-btn" onclick="startTimer(30)">30s</button><button class="timer-btn" onclick="startTimer(60)">60s</button><button class="timer-btn" onclick="startTimer(90)">90s</button><button class="timer-btn" style="color:red" onclick="resetTimer()">Stop</button></div></div>
<script>
const initialData={
Chest:[
{id:'c1',name:'Dumbbell Incline',target:'3 x 10',history:['25, 25, 25','25, 25, 30','30, 30, 30']},{id:'c2',name:'Cable Low to High',target:'3 x 15',history:['10, 10, 10','10, 15, 15','15, 15, 15']},{id:'c3',name:'Flat Bar Smith',target:'3 x 8',history:['15, 20, 20','20, 25, 30','30, 30, 30','35, 35, 35']},{id:'c4',name:'Fly Machine',target:'3 x 15',history:['20, 25, 25','25, 30, 30','30, 35, 35','35, 35, 40']}],
Back:[
{id:'b1',name:'Cable Row Wide Grip',target:'3 x 10',history:['30, 35, 40','40, 45, 50','45, 50, 55','55, 55, 60']},{id:'b2',name:'One Hand Lat Cable',target:'3 x 15',history:['30, 30, 30','30, 35, 35','35, 40, 40']},{id:'b3',name:'V-Bar Lat Pull Down',target:'3 x 12',history:['50, 50, 50','50, 55, 55','55, 65, 65']},{id:'b4',name:'One Hand Row',target:'3 x 15',history:['15, 15, 15','20, 20, 20']}],
Shoulder:[
{id:'s1',name:'Dumbbell Rear Delt',target:'3 x 12',history:['7.5, 10, 10','10, 12.5, 12.5','12.5, 15, 15']},{id:'s2',name:'Rear Delt Fly 🦋',target:'3 x 20',history:['10, 10, 10','10, 15, 15','15, 20, 20']},{id:'s3',name:'D Lateral Raises',target:'3 x 15',history:['7.5, 7.5, 7.5','7.5, 10, 10','10, 10, 12.5']},{id:'s4',name:'Cable Fly One Hand',target:'3 x 20',history:['5, 5, 5','5, 10, 10','10, 10, 10']},{id:'s5',name:'Smith Front Press',target:'3 x 10',history:['20, 25, 25','25, 30, 35','30, 35, 40']},{id:'s6',name:'Plate Front Raises',target:'3 x 15',history:['10, 10, 10','10, 10, 15']},{id:'s7',name:'Dumbbell Shrug',target:'3 x 15',history:[]},{id:'s8',name:'Barbell Shrug Back',target:'3 x 10',history:[]}],
Arm:[
{id:'a1',name:'Z Bar (Superset)',target:'3 x 10',history:['30, 30, 30','30, 30, 40','30, 40, 40']},{id:'a2',name:'Cable Push Down (Superset)',target:'3 x 10',history:['50, 55, 60','60, 60, 65','65, 65, 70']},{id:'a3',name:'Horse One Hand DB',target:'3 x 15',history:['12.5, 12.5, 12.5','12.5, 15, 15']},{id:'a4',name:'Cable One Hand',target:'3 x 15',history:['10, 10, 10','10, 10, 15','15, 15, 15']},{id:'a5',name:'Hammer Rope',target:'3 x 10',history:['30, 30, 35','40, 45, 50','45, 50, 55']},{id:'a6',name:'Overhead Machine',target:'3 x 10',history:['15, 15, 15','15, 20, 20','20, 20, 25']}],
Leg:[
{id:'l1',name:'Lunges',target:'3 x 15',history:['10, 10, 10']},{id:'l2',name:'Leg Press',target:'3 x 10',history:['60, 70, 80']},{id:'l3',name:'Leg Extension',target:'3 x 20',history:['25, 25, 25']},{id:'l4',name:'Leg Curls',target:'3 x 20',history:['30, 30, 30']},{id:'l5',name:'Calf Raises',target:'3 x 20',history:[]}]};
let workoutData=JSON.parse(localStorage.getItem('myGymData'))||initialData;let currentCategory='Chest';
function renderTabs(){document.getElementById('categoryTabs').innerHTML=Object.keys(workoutData).map(cat=>`<button class="tab-btn ${cat===currentCategory?'active':''}" onclick="selectCategory('${cat}')">${cat}</button>`).join('')}
function selectCategory(cat){currentCategory=cat;renderTabs();renderExercises()}
function renderExercises(){const container=document.getElementById('exerciseList');const exercises=workoutData[currentCategory]||[];container.innerHTML=exercises.map(ex=>`<div class="exercise-card"><div class="ex-header"><span class="ex-name">${ex.name}</span><span class="ex-target">${ex.target}</span></div><div class="history-list">${ex.history.length?ex.history.map((h,i)=>`<div class="history-item"><span>Entry ${i+1}</span><strong>${h} kg</strong></div>`).join(''):'<div class="history-item"><span>No records yet</span></div>'}</div><button class="btn btn-outline" onclick="toggleForm('${ex.id}')">+ Log New Weight</button><div class="log-form" id="form-${ex.id}"><div class="inputs-grid"><div class="input-group"><label>Set 1</label><input type="number" id="s1-${ex.id}" placeholder="kg"></div><div class="input-group"><label>Set 2</label><input type="number" id="s2-${ex.id}" placeholder="kg"></div><div class="input-group"><label>Set 3</label><input type="number" id="s3-${ex.id}" placeholder="kg"></div></div><button class="btn btn-dark" onclick="saveEntry('${ex.id}')">Save</button></div></div>`).join('')}
function toggleForm(id){document.getElementById(`form-${id}`).classList.toggle('open')}
function saveEntry(id){const s1=document.getElementById(`s1-${id}`).value||'0';const s2=document.getElementById(`s2-${id}`).value||'0';const s3=document.getElementById(`s3-${id}`).value||'0';const ex=workoutData[currentCategory].find(e=>e.id===id);if(ex){ex.history.push(`${s1}, ${s2}, ${s3}`);localStorage.setItem('myGymData',JSON.stringify(workoutData));renderExercises()}}
let timerInterval=null;function startTimer(seconds){clearInterval(timerInterval);let timeLeft=seconds;updateTimerDisplay(timeLeft);timerInterval=setInterval(()=>{timeLeft--;updateTimerDisplay(timeLeft);if(timeLeft<=0){clearInterval(timerInterval);alert('Time is up! Next set.')}},1000)}function resetTimer(){clearInterval(timerInterval);updateTimerDisplay(0)}function updateTimerDisplay(sec){const m=Math.floor(sec/60).toString().padStart(2,'0');const s=(sec%60).toString().padStart(2,'0');document.getElementById('timerDisplay').innerText=`${m}:${s}`}
renderTabs();renderExercises();
</script></body></html>
